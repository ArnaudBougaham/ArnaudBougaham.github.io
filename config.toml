baseURL = 'https://ArnaudBougaham.github.io/'
languageCode = 'en'
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false
theme = 'PaperMod'

# Global params (applied to all languages unless overridden)
[params]
  disableLangToggle = false

# Languages configuration - both languages use the same content directory
[languages]
  [languages.en]
    contentDir = 'content'
    languageName = 'English'
    weight = 1
    title = 'Arnaud Bougaham - Ph.D.'
    [languages.en.params]
      env = 'production'
      title = 'Arnaud Bougaham'
      description = 'Research Scientist | Ph.D. | Applied Artificial Intelligence | Industrial & Medical Imaging | Machine Learning | Anomaly Detection'
      keywords = ['Research', 'AI', 'Machine Learning', 'Anomaly Detection', 'Ph.D.', 'Computer Science']
      author = 'Arnaud Bougaham'
      images = ['/images/photos/profile.jpg']
      defaultTheme = 'dark'
      homeInfoMode = false
      ShowReadingTime = true
      ShowPostNavLinks = true
      ShowBreadCrumbs = true
      ShowCodeCopyButtons = true
      ShowWordCount = true
      ShowRssButtonInSectionTermList = true
      UseHugoToc = true
      disableSpecial1stPost = false
      disableScrollToTop = false
      comments = false
      hidemeta = false
      hideSummary = false
      showtoc = true
      tocopen = false
      [languages.en.params.profileMode]
        enabled = true
        title = "Arnaud Bougaham"
        subtitle = "Research Scientist | Ph.D. | Operational Technologies Engineer"
        imageUrl = "images/photos/profile.jpg"
        imageTitle = "Arnaud Bougaham"
        imageWidth = 1200
        imageHeight = 1560
      [[languages.en.params.socialIcons]]
        name = "github"
        url = "https://github.com/ArnaudBougaham"
      [[languages.en.params.socialIcons]]
        name = "linkedin"
