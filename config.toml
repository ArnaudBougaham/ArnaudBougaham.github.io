      [[languages.en.params.socialIcons]]
        name = "orcid"
        url = "https://orcid.org/0000-0003-0467-6991"
      [[languages.en.params.socialIcons]]
        name = "link"
        url = "https://researchportal.unamur.be/en/persons/abougaha/"
        title = "Research Portal"
      [[languages.en.params.socialIcons]]
        name = "cv"
        url = "/Resume_ArnaudBougaham_2025_anon.pdf"
        title = "Download Resume (PDF)"
